[project]
site_name = "pg-partsmith"
site_description = "PostgreSQL partition lifecycle management with a plan you can read before it runs"
site_author = "Alex Shalaev"
repo_name = "bedrock-python/pg-partsmith"
repo_url = "https://github.com/bedrock-python/pg-partsmith"
edit_uri = "edit/master/docs/"
copyright = "Copyright &copy; 2026 Alex Shalaev"
docs_dir = "docs"
site_dir = "site"

extra_css = ["assets/stylesheets/copy-page.css", "assets/stylesheets/admonitions.css"]
extra_javascript = ["assets/javascripts/copy-page.js"]

nav = [
    { "Home" = "index.md" },
    { "For AI agents" = "agents.md" },
    { "Getting started" = [
        { "Installation" = "getting-started/installation.md" },
        { "Tutorial: your first partitioned table" = "getting-started/first-table.md" },
        { "Tutorial: running it in production" = "getting-started/production.md" },
        { "Tutorial: a multi-tenant event store" = "getting-started/event-store.md" },
    ] },
    { "Concepts" = [
        { "How it works" = "concepts/overview.md" },
        { "Partition schemes" = "concepts/schemes.md" },
        { "Boundaries, cursors and calendars" = "concepts/boundaries.md" },
        { "Lifecycle policies" = "concepts/lifecycle.md" },
        { "The maintenance plan" = "concepts/plan.md" },
        { "Ownership and safety" = "concepts/ownership.md" },
        { "Executing DDL" = "concepts/execution.md" },
        { "Leaf backends" = "concepts/leaves.md" },
    ] },
    { "How-to guides" = [
        { "Configure a table" = "guide/configuration.md" },
        { "Schedule maintenance" = "guide/scheduling.md" },
        { "The command line" = "guide/cli.md" },
        { "Monitor and alert" = "guide/monitoring.md" },
        { "Query a partitioned table" = "guide/querying.md" },
        { "Backfill partitions for existing data" = "guide/backfill.md" },
        { "Partition an existing table" = "guide/partition-existing-table.md" },
        { "Migrate from pg_partman or a script" = "guide/migration.md" },
        { "Change a scheme safely" = "guide/changing-the-scheme.md" },
        { "Archive before dropping" = "guide/archiving.md" },
        { "Handle foreign keys" = "guide/foreign-keys.md" },
        { "Tier cold data to a foreign server" = "guide/cold-tiering.md" },
        { "Custom calendars, names and codecs" = "guide/calendars-and-codecs.md" },
        { "Extend the library" = "guide/extending.md" },
        { "Troubleshoot" = "guide/troubleshooting.md" },
        { "Recipes from real systems" = "guide/recipes.md" },
    ] },
    { "Reference" = [
        { "API" = "reference/index.md" },
        { "Configuration fields" = "reference/configuration.md" },
        { "The configuration document" = "reference/document.md" },
        { "Findings and issues" = "reference/findings.md" },
        { "Environment settings" = "reference/settings.md" },
        { "Glossary" = "reference/glossary.md" },
    ] },
    { "Design" = [
        { "RFC 0001: partition schemes" = "design/rfc-0001-partition-schemes.md" },
        { "OSS research" = "design/oss-research.md" },
        { "PostgreSQL semantics" = "design/postgresql-semantics.md" },
        { "1.0 API cheat sheet" = "design/api-cheatsheet-1.0.md" },
        { "Final report: what 1.0 changed" = "design/final-report.md" },
    ] },
    { "Changelog" = "changelog.md" },
]

[project.theme]
custom_dir = "overrides"
features = [
    "content.code.annotate",
    "content.code.copy",
    "content.code.select",
    "content.tabs.link",
    "content.tooltips",
    "navigation.footer",
    "navigation.indexes",
    "navigation.instant",
    "navigation.instant.prefetch",
    "navigation.path",
    "navigation.sections",
    "navigation.tabs",
    "navigation.tabs.sticky",
    "navigation.top",
    "navigation.tracking",
    "search.highlight",
    "search.share",
    "search.suggest",
    "toc.follow",
    "toc.integrate",
]

[[project.theme.palette]]
scheme = "slate"
toggle.icon = "lucide/moon"
toggle.name = "Switch to light mode"

[[project.theme.palette]]
scheme = "default"
toggle.icon = "lucide/sun"
toggle.name = "Switch to dark mode"

[project.plugins.mkdocstrings.handlers.python]
inventories = ["https://docs.python.org/3/objects.inv"]
paths = ["."]

[project.plugins.mkdocstrings.handlers.python.options]
docstring_style = "google"
inherited_members = true
show_source = true
show_root_full_path = false
show_symbol_type_heading = true
show_symbol_type_toc = true
heading_level = 3
