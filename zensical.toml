[project]
site_name = "pg-partsmith"
site_description = "PostgreSQL partition lifecycle management with a plan you can read before it runs"
site_author = "Alex Shalaev"
repo_name = "bedrock-python/pg-partsmith"
repo_url = "https://github.com/bedrock-python/pg-partsmith"
edit_uri = "edit/master/docs/"
copyright = "Copyright &copy; 2026 Alex Shalaev"
docs_dir = "docs"
site_dir = "site"

nav = [
    { "Home" = "index.md" },
    { "Guide" = [
        { "Quick start" = "guide/quickstart.md" },
        { "Configuration" = "guide/configuration.md" },
        { "Partition schemes" = "guide/partition-schemes.md" },
        { "Boundaries and codecs" = "guide/boundary-codecs.md" },
        { "Lifecycle policies" = "guide/lifecycle-policies.md" },
        { "Planning and dry runs" = "guide/planning.md" },
        { "Period strategies" = "guide/strategies.md" },
        { "Lifecycle hooks" = "guide/hooks.md" },
        { "Lock managers" = "guide/locks.md" },
        { "Advanced" = "guide/advanced.md" },
        { "Recipes" = "guide/recipes.md" },
        { "Migrating an existing partitioner" = "guide/migration.md" },
        { "Example: an event store with TIME -> HASH" = "guide/nested-migration.md" },
    ] },
    { "Design" = [
        { "RFC 0001: partition schemes" = "design/rfc-0001-partition-schemes.md" },
        { "OSS research" = "design/oss-research.md" },
        { "PostgreSQL semantics" = "design/postgresql-semantics.md" },
        { "1.0 API cheat sheet" = "design/api-cheatsheet-1.0.md" },
    ] },
    { "API Reference" = "reference/index.md" },
    { "Changelog" = "changelog.md" },
]

[project.theme]
features = [
    "content.code.annotate",
    "content.code.copy",
    "content.code.select",
    "content.tabs.link",
    "content.tooltips",
    "navigation.footer",
    "navigation.indexes",
    "navigation.instant",
    "navigation.instant.prefetch",
    "navigation.path",
    "navigation.sections",
    "navigation.tabs",
    "navigation.tabs.sticky",
    "navigation.top",
    "navigation.tracking",
    "search.highlight",
    "search.share",
    "search.suggest",
    "toc.follow",
    "toc.integrate",
]

[[project.theme.palette]]
scheme = "slate"
toggle.icon = "lucide/moon"
toggle.name = "Switch to light mode"

[[project.theme.palette]]
scheme = "default"
toggle.icon = "lucide/sun"
toggle.name = "Switch to dark mode"

[project.plugins.mkdocstrings.handlers.python]
inventories = ["https://docs.python.org/3/objects.inv"]
paths = ["."]

[project.plugins.mkdocstrings.handlers.python.options]
docstring_style = "google"
inherited_members = true
show_source = true
show_root_full_path = false
show_symbol_type_heading = true
show_symbol_type_toc = true
heading_level = 3
