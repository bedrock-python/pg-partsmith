[project]
name = "pg-partsmith"
dynamic = ["version"]
description = "PostgreSQL partition lifecycle management with extensible hooks"
readme = "README.md"
requires-python = ">=3.11"
license = { file = "LICENSE" }
authors = [{ name = "Alex Shalaev", email = "shalaevad.alexey@gmail.com" }]
keywords = ["postgresql", "partitioning", "asyncio", "database", "partition-management"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Framework :: AsyncIO",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Database",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Typing :: Typed",
]
dependencies = [
    "pydantic>=2.6.0,<3.0.0",
    "python-dateutil>=2.7.0,<3.0.0",
    "sqlalchemy[asyncio]>=2.0.0,<3.0.0",
]

[project.urls]
Repository = "https://github.com/bedrock-python/pg-partsmith"
Documentation = "https://bedrock-python.github.io/pg-partsmith/"
Changelog = "https://github.com/bedrock-python/pg-partsmith/blob/master/CHANGELOG.md"
"Bug Tracker" = "https://github.com/bedrock-python/pg-partsmith/issues"

[project.scripts]
pg-partsmith = "pg_partsmith.cli:main"

[project.optional-dependencies]
redis-locks = ["redis>=4.2.0"]
pydantic-settings = ["pydantic-settings>=2.0.0,<3.0.0"]
cli = ["pyyaml>=6.0,<7.0", "asyncpg>=0.29.0", "typer>=0.17,<1.0"]

[dependency-groups]
test = [
    "pytest>=9.0.2",
    "pytest-asyncio>=1.3.0",
    "pytest-cov>=7.0.0",
    "testcontainers[redis]>=4.14.1",
    "asyncpg>=0.31.0",
    "freezegun>=1.5.5",
    "tzdata>=2024.1",
    "psycopg2-binary>=2.9.11",
    "types-python-dateutil~=2.9.0",
    "pyyaml>=6.0,<7.0",
    "types-pyyaml>=6.0",
    "pydantic-settings>=2.0.0,<3.0.0",
    "typer>=0.17,<1.0",
]
docs = [
    "zensical>=0.0.37",
    "mkdocstrings-python>=2.0.3",
]
dev = [
    "ruff>=0.15.1",
    "mypy>=1.19.1",
    "pre-commit>=4.5.1",
    "types-python-dateutil~=2.9.0",
    { include-group = "test" },
]

[tool.uv]
link-mode = "copy"

[tool.check-wheel-contents]
# W002, duplicate files: the sync package mirrors the aio one file for file,
# and a package marker that says nothing is the same bytes in both.
ignore = ["W002"]

[tool.hatch.version]
path = "pg_partsmith/__version__.py"

[tool.hatch.build.targets.wheel]
packages = ["pg_partsmith"]

[tool.hatch.build.targets.sdist]
include = ["/pg_partsmith", "/README.md", "/LICENSE", "/CHANGELOG.md"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"


[tool.mypy]
python_version = "3.11"
files = ["pg_partsmith"]
mypy_path = ["."]
plugins = ["sqlalchemy.ext.mypy.plugin", "pydantic.mypy"]
check_untyped_defs = true
disallow_untyped_defs = true
implicit_reexport = false
ignore_missing_imports = true
show_error_codes = true
warn_return_any = true
warn_unused_configs = true
warn_redundant_casts = true
warn_unreachable = true


[tool.ruff]
line-length = 120
target-version = "py311"
extend-exclude = ["examples"]

[tool.ruff.lint]
select = ["F", "E", "W", "I", "B", "N", "S", "C4", "DTZ", "SIM", "TRY", "PERF", "RUF", "UP", "ANN", "T20", "PTH", "PLC", "PLE", "PLW"]
ignore = ["TRY003", "S101", "ANN401", "RUF012", "S104", "S105", "S106", "ANN204", "DTZ", "ANN", "N802", "PERF401", "SIM105", "S607"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "auto"


[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
pythonpath = ["."]
addopts = [
    "-v",
    "--strict-markers",
    "--tb=short",
]
markers = [
    "unit: mark a test as a unit test.",
    "integration: mark a test as an integration test.",
    "e2e: mark a test as an end-to-end test of the container image; needs PG_PARTSMITH_E2E_IMAGE.",
]
# A warning is a deprecation notice with a date on it; the suite fails on the
# day it appears rather than on the day the removal ships. The one ignored is
# testcontainers deprecating a decorator it still uses itself.
filterwarnings = [
    "error",
    "ignore:The @wait_container_is_ready decorator is deprecated:DeprecationWarning",
]

[tool.coverage.run]
source = ["pg_partsmith"]
# Statement coverage counts a half-taken branch as covered, which is how a
# guard can be at 100% with only one of its two outcomes ever exercised.
branch = true
omit = [
    "tests/*",
    "*/test_*.py",
]
