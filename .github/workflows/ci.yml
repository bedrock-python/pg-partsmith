name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

# A push while the previous run is still going restarts it; the old one is
# answering a question nobody is asking any more.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint & type check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock
      - run: uv sync --frozen --group dev
      - run: uv run ruff check
      - run: uv run ruff format --check
      - run: uv run mypy pg_partsmith

  test-unit:
    name: Unit tests (Python ${{ matrix.python-version }})
    needs: lint
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
        with:
          python-version: ${{ matrix.python-version }}
          enable-cache: true
          cache-dependency-glob: uv.lock
      - run: uv sync --frozen --group dev --extra pydantic-settings
      - run: uv run pytest -m unit --cov=pg_partsmith --cov-report=xml
      - uses: codecov/codecov-action@v7
        if: matrix.python-version == '3.11'
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: coverage.xml
        continue-on-error: true

  test-integration:
    name: Integration tests (PostgreSQL ${{ matrix.postgres }}) & coverage gate
    needs: lint
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        postgres: ["15-alpine", "16-alpine", "17-alpine"]
    env:
      PG_PARTSMITH_TEST_PG_IMAGE: postgres:${{ matrix.postgres }}
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock
      - run: uv sync --frozen --group dev --extra pydantic-settings
      # Both suites together: the gate is on the whole library, not on one half of it.
      - run: uv run pytest --cov=pg_partsmith --cov-report=xml --cov-fail-under=90
      - uses: codecov/codecov-action@v7
        if: matrix.postgres == '17-alpine'
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: coverage.xml
        continue-on-error: true

  image:
    name: Container image
    needs: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v3
      - name: Build
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: pg-partsmith:ci
          build-args: VERSION=ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
      # Size is the first thing a team evaluating this reads, so a regression in
      # it is a build failure and not a note in a release.
      - name: Size budget
        run: |
          BYTES=$(docker image inspect pg-partsmith:ci -f '{{.Size}}')
          MB=$((BYTES / 1024 / 1024))
          echo "image is ${MB} MB (budget ${IMAGE_SIZE_BUDGET_MB} MB)"
          test "$MB" -le "$IMAGE_SIZE_BUDGET_MB"
        env:
          IMAGE_SIZE_BUDGET_MB: 160
      - name: It runs, not as root, with every library it links against
        run: |
          docker run --rm pg-partsmith:ci --version
          docker run --rm pg-partsmith:ci plan --help >/dev/null
          docker run --rm --entrypoint /opt/venv/bin/python pg-partsmith:ci -c '
          import os, ssl, hashlib, zlib, bz2, lzma, uuid, asyncpg, pydantic_core, yaml, greenlet, sqlalchemy, typer
          assert os.getuid() == 65532, os.getuid()
          assert not os.path.exists("/bin/sh"), "a shell got in"
          print("closure ok, uid 65532, no shell,", ssl.OPENSSL_VERSION)
          '
      - name: Scan
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: pg-partsmith:ci
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: "1"

  # Sentinel job — use this as the single required status check in branch protection.
  all-checks-passed:
    name: All checks passed
    if: always()
    needs: [lint, test-unit, test-integration, image]
    runs-on: ubuntu-latest
    steps:
      - name: Check all jobs succeeded
        run: |
          if [[ "${{ contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') }}" == "true" ]]; then
            echo "One or more required checks failed."
            exit 1
          fi
          echo "All checks passed."
