name: Publish

# What reaches PyPI is decided here and in the `pypi` environment, which
# setup_repo.py makes deployable from master only. Both triggers run with
# master as their ref, so the checks below are always master's own; a run from
# any other branch is refused the environment before it can publish.
on:
  workflow_run:
    workflows: ["Release Please"]
    types: [completed]
  # A manual publish, from master: gh workflow run publish.yml -f tag=<tag>
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to publish (e.g. pg-partsmith-v0.1.0)"
        required: true

# Each job asks for exactly what it needs; the workflow itself only reads.
permissions:
  contents: read

env:
  IMAGE: ghcr.io/bedrock-python/pg-partsmith

jobs:
  check:
    name: Check release
    if: >
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.event == 'push' &&
       github.event.workflow_run.head_branch == 'master')
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
      actions: read   # the CI run on the released commit
    outputs:
      tag: ${{ steps.release.outputs.tag }}
      sha: ${{ steps.release.outputs.sha }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0   # master's history and every tag

      # The tag names a commit; it is never the ref this run starts from. It has
      # to be on master, and the version it carries has to be the one committed
      # in __version__.py -- the artifacts are built from that file, so a tag
      # that disagrees with it is a mistake to stop on, not to paper over.
      - name: Resolve the release tag
        id: release
        env:
          EVENT: ${{ github.event_name }}
          REF: ${{ github.ref }}
          INPUT_TAG: ${{ inputs.tag }}
          PUSHED_SHA: ${{ github.event.workflow_run.head_sha }}
          # Both tag conventions, the component-prefixed one and the bare one,
          # so a Release Please config change cannot silently stop publishing.
          TAG_PATTERN: '^(pg-partsmith-)?v[0-9][0-9A-Za-z.+-]*$'
          TAG_PREFIX: "pg-partsmith-"
          VERSION_FILE: "pg_partsmith/__version__.py"
        run: |
          if [ "$EVENT" = workflow_dispatch ]; then
            if [ "$REF" != refs/heads/master ]; then
              echo "::error::Publish from master, not $REF: gh workflow run publish.yml --ref master -f tag=<tag>"
              exit 1
            fi
            if [[ ! "$INPUT_TAG" =~ $TAG_PATTERN ]]; then
              echo "::error::'$INPUT_TAG' is not a release tag of this project"
              exit 1
            fi
            TAG=$INPUT_TAG
            if ! SHA=$(git rev-parse -q --verify "refs/tags/$TAG^{commit}"); then
              echo "::error::There is no tag $TAG"
              exit 1
            fi
          else
            SHA=$PUSHED_SHA
            TAG=$(git tag --points-at "$SHA" | grep -E "$TAG_PATTERN" | head -1 || true)
            if [ -z "$TAG" ]; then
              echo "No release tag on $SHA, nothing to publish."
              exit 0
            fi
          fi

          if ! git merge-base --is-ancestor "$SHA" origin/master; then
            echo "::error::$TAG points at $SHA, which is not on master"
            exit 1
          fi

          VERSION=${TAG#"$TAG_PREFIX"}
          VERSION=${VERSION#v}
          COMMITTED=$(git show "$SHA:$VERSION_FILE" | sed -n 's/^__version__ = "\([^"]*\)".*/\1/p')
          if [ "$COMMITTED" != "$VERSION" ]; then
            echo "::error::$TAG is version $VERSION, but $VERSION_FILE at $SHA says '$COMMITTED'"
            exit 1
          fi

          echo "Will publish $TAG ($SHA)"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "sha=$SHA" >> "$GITHUB_OUTPUT"

      # Release Please and CI start from the same push, and Release Please is
      # done minutes earlier: without this wait a release is uploaded before CI
      # has said anything about the commit being released. A version on PyPI
      # cannot be replaced. If CI failed, fix or re-run it, then re-run this.
      - name: Wait for CI on the released commit
        if: steps.release.outputs.tag != ''
        env:
          GH_TOKEN: ${{ github.token }}
          SHA: ${{ steps.release.outputs.sha }}
        run: |
          runs="repos/$GITHUB_REPOSITORY/actions/workflows/ci.yml/runs?head_sha=$SHA&event=push&branch=master"
          RUN=
          for _ in 1 2 3 4 5 6; do
            RUN=$(gh api "$runs" --jq '.workflow_runs[0].id // empty' || true)
            [ -n "$RUN" ] && break
            sleep 20
          done
          if [ -z "$RUN" ]; then
            echo "::error::No CI run for $SHA on master"
            exit 1
          fi
          echo "Waiting for $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$RUN"
          until [ "$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$RUN" --jq .status)" = completed ]; do
            sleep 20
          done
          CONCLUSION=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$RUN" --jq .conclusion)
          if [ "$CONCLUSION" != success ]; then
            echo "::error::CI on $SHA ended '$CONCLUSION'"
            exit 1
          fi
          echo "CI passed on $SHA"

  # The image first, on each architecture natively: built, made to say the
  # version it is about to be tagged with, scanned, and pushed by digest --
  # untagged, so nothing is visible yet. If any of that fails, PyPI has not
  # been touched and there is no half of a release to explain.
  image:
    name: Build, scan and push the image (${{ matrix.arch }})
    needs: check
    if: needs.check.outputs.tag != ''
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        include:
          - { os: ubuntu-latest, arch: amd64 }
          - { os: ubuntu-24.04-arm, arch: arm64 }
    outputs:
      version: ${{ steps.version.outputs.version }}
      minor: ${{ steps.version.outputs.minor }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.check.outputs.sha }}

      # The library, the CLI and the image carry the same number, always. It
      # comes off the tag here so the label, the tags and `--version` inside the
      # container cannot disagree; `check` has already matched the tag against
      # __version__.py. Either tag convention, as `check` accepts both.
      - name: Resolve version
        id: version
        run: |
          VERSION="${TAG#pg-partsmith-}"
          VERSION="${VERSION#v}"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "minor=${VERSION%.*}" >> "$GITHUB_OUTPUT"
        env:
          TAG: ${{ needs.check.outputs.tag }}

      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build
        uses: docker/build-push-action@v7
        with:
          context: .
          load: true
          tags: pg-partsmith:release
          build-args: VERSION=${{ steps.version.outputs.version }}
          cache-from: type=gha,scope=${{ runner.arch }}
          cache-to: type=gha,mode=max,scope=${{ runner.arch }}

      - name: The image reports the version it is tagged with
        run: |
          test "$(docker run --rm pg-partsmith:release --version)" = "pg-partsmith ${VERSION}"
        env:
          VERSION: ${{ steps.version.outputs.version }}

      - name: Scan
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: pg-partsmith:release
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: "1"

      # The same build again, from the cache, pushed under its digest alone. An
      # SBOM and a build provenance attestation travel with it, so "what is in
      # it" and "what built it" are answers in the registry.
      - name: Push by digest
        id: push
        uses: docker/build-push-action@v7
        with:
          context: .
          build-args: VERSION=${{ steps.version.outputs.version }}
          cache-from: type=gha,scope=${{ runner.arch }}
          sbom: true
          provenance: mode=max
          tags: ${{ env.IMAGE }}
          outputs: type=image,push-by-digest=true,name-canonical=true,push=true

      - name: Hand the digest on
        run: |
          mkdir -p "${RUNNER_TEMP}/digests"
          touch "${RUNNER_TEMP}/digests/${DIGEST#sha256:}"
        env:
          DIGEST: ${{ steps.push.outputs.digest }}
      - uses: actions/upload-artifact@v7
        with:
          name: digest-${{ matrix.arch }}
          path: ${{ runner.temp }}/digests/*
          if-no-files-found: error
          retention-days: 1

  publish:
    name: Publish to PyPI
    needs: [check, image]
    if: needs.check.outputs.tag != ''
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      contents: read
      id-token: write   # Trusted Publisher (PyPI OIDC)
    steps:
      # The commit check resolved, not the tag: a tag moved since then changes nothing.
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.check.outputs.sha }}

      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock
      - run: uv build
      # PEP 740 provenance. uv publish uploads attestations but does not make
      # them: this signs each distribution with the job's OIDC identity
      # (Sigstore) into <file>.publish.attestation, and PyPI rejects an upload
      # whose attestation does not match the Trusted Publisher.
      - run: uvx --from 'pypi-attestations>=0.0.30' pypi-attestations sign dist/*.whl dist/*.tar.gz
      # No file arguments: uv's default, dist/*, takes in the .attestation files
      # too; naming the distributions would upload them without their
      # attestations. --check-url: a run repeated after a failure further down
      # skips what is already on the index instead of failing on it, and
      # carries on to the tags.
      - run: uv publish --check-url https://pypi.org/simple/pg-partsmith/

  # One index over both architectures' images, under the exact tag, the minor
  # one and `latest`, signed. The guides tell a schedule to follow the minor:
  # on `latest` it would cross a major on its own.
  tags:
    name: Tag and sign the image
    needs: [check, image, publish]
    if: needs.check.outputs.tag != ''
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write   # keyless signing
    env:
      VERSION: ${{ needs.image.outputs.version }}
      MINOR: ${{ needs.image.outputs.minor }}
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: ${{ runner.temp }}/digests
          pattern: digest-*
          merge-multiple: true
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: The two tags
        run: |
          cd "${RUNNER_TEMP}/digests"
          refs=()
          for digest in *; do refs+=("${IMAGE}@sha256:${digest}"); done
          docker buildx imagetools create -t "${IMAGE}:${VERSION}" -t "${IMAGE}:${MINOR}" -t "${IMAGE}:latest" "${refs[@]}"
          docker buildx imagetools inspect "${IMAGE}:${VERSION}"

      # Signed keylessly with the workflow's own identity: `cosign verify` can
      # then prove the index was built by this repository's release workflow
      # on master, and not by anyone holding a leaked token.
      - uses: sigstore/cosign-installer@v3
      - name: Sign
        run: |
          DIGEST="sha256:$(docker buildx imagetools inspect "${IMAGE}:${VERSION}" --raw | sha256sum | cut -d' ' -f1)"
          cosign sign --yes "${IMAGE}@${DIGEST}"

  # What a team pulls is checked the way the container guide tells them to check
  # it, on both architectures: the signature, the SBOM and the provenance, the
  # version inside against the tag, the minor tag against the exact one -- and
  # then the end-to-end suite runs against the published image itself. A
  # failure here is a red release run to read, not an unpublished image.
  verify:
    name: The published image, verified (${{ matrix.os }})
    needs: [check, image, tags]
    if: needs.check.outputs.tag != ''
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
      packages: read
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, ubuntu-24.04-arm]
    env:
      VERSION: ${{ needs.image.outputs.version }}
      MINOR: ${{ needs.image.outputs.minor }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.check.outputs.sha }}
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Pull what was pushed
        run: docker pull "${IMAGE}:${VERSION}"

      - uses: sigstore/cosign-installer@v3
      - name: Signed by this repository's release workflow, on master
        run: |
          cosign verify "${IMAGE}:${VERSION}" \
            --certificate-identity "https://github.com/bedrock-python/pg-partsmith/.github/workflows/publish.yml@refs/heads/master" \
            --certificate-oidc-issuer https://token.actions.githubusercontent.com

      - name: The version inside, the label, the minor and latest tags, the SBOM and the provenance
        run: |
          test "$(docker run --rm "${IMAGE}:${VERSION}" --version)" = "pg-partsmith ${VERSION}"
          test "$(docker image inspect "${IMAGE}:${VERSION}" -f '{{index .Config.Labels "org.opencontainers.image.version"}}')" = "${VERSION}"
          exact="$(docker buildx imagetools inspect "${IMAGE}:${VERSION}" --raw | sha256sum)"
          test "$exact" = "$(docker buildx imagetools inspect "${IMAGE}:${MINOR}" --raw | sha256sum)"
          test "$exact" = "$(docker buildx imagetools inspect "${IMAGE}:latest" --raw | sha256sum)"
          docker buildx imagetools inspect "${IMAGE}:${VERSION}" --format '{{json .SBOM}}' | grep -q '"SPDX"'
          docker buildx imagetools inspect "${IMAGE}:${VERSION}" --format '{{json .Provenance}}' | grep -q '"SLSA"'

      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock
      - run: uv sync --frozen --no-default-groups --group test --extra pydantic-settings
      - name: End to end, against the published image
        run: uv run --no-sync pytest -m e2e
        env:
          PG_PARTSMITH_E2E_IMAGE: ghcr.io/bedrock-python/pg-partsmith:${{ needs.image.outputs.version }}
