name: Publish

on:
  workflow_run:
    workflows: ["Release Please"]
    types: [completed]
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to publish (e.g. pg-partsmith-v0.1.0)"
        required: true

permissions:
  contents: read
  id-token: write   # Trusted Publisher (PyPI OIDC)
  packages: write   # ghcr.io

jobs:
  check:
    name: Check release tag
    if: >
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.head_branch == 'master')
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.tag.outputs.tag }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.event.workflow_run.head_sha }}
          fetch-tags: true

      - name: Resolve tag
        id: tag
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "tag=${{ inputs.tag }}" >> "$GITHUB_OUTPUT"
          else
            TAG=$(git tag --points-at HEAD | grep -E '^pg-partsmith-v' | head -1)
            echo "tag=$TAG" >> "$GITHUB_OUTPUT"
            if [ -z "$TAG" ]; then
              echo "No release tag on this commit — skipping publish."
            else
              echo "Will publish $TAG"
            fi
          fi

  publish:
    name: Build and publish to PyPI
    needs: check
    if: needs.check.outputs.tag != ''
    runs-on: ubuntu-latest
    environment: pypi
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.check.outputs.tag }}

      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock
      - run: uv build
      - run: uv publish

  image:
    name: Build and publish the image
    needs: [check, publish]
    if: needs.check.outputs.tag != ''
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      minor: ${{ steps.version.outputs.minor }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.check.outputs.tag }}

      # The library, the CLI and the image carry the same number, always. It
      # comes off the tag here so the label, the tags and `--version` inside the
      # container cannot disagree.
      - name: Resolve version
        id: version
        run: |
          VERSION="${TAG#pg-partsmith-v}"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "minor=${VERSION%.*}" >> "$GITHUB_OUTPUT"
        env:
          TAG: ${{ needs.check.outputs.tag }}

      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: pg-partsmith:release
          build-args: VERSION=${{ steps.version.outputs.version }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: The image reports the version it is tagged with
        run: |
          test "$(docker run --rm pg-partsmith:release --version)" = "pg-partsmith ${VERSION}"
        env:
          VERSION: ${{ steps.version.outputs.version }}

      - name: Scan
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: pg-partsmith:release
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: "1"

      # The exact version, and a minor tag that moves within it. Never `latest`:
      # a CronJob following it would cross a major on its own.
      - name: Push
        id: push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          platforms: linux/amd64,linux/arm64
          build-args: VERSION=${{ steps.version.outputs.version }}
          cache-from: type=gha
          # An SBOM and a build provenance attestation travel with the image,
          # so "what is in it" and "what built it" are answers in the registry.
          sbom: true
          provenance: mode=max
          tags: |
            ghcr.io/bedrock-python/pg-partsmith:${{ steps.version.outputs.version }}
            ghcr.io/bedrock-python/pg-partsmith:${{ steps.version.outputs.minor }}

      # Signed keylessly with the workflow's own identity: `cosign verify` can
      # then prove the image was built by this repository's release workflow,
      # from this tag, and not by anyone holding a leaked token.
      - uses: sigstore/cosign-installer@v3
      - name: Sign
        run: cosign sign --yes "ghcr.io/bedrock-python/pg-partsmith@${DIGEST}"
        env:
          DIGEST: ${{ steps.push.outputs.digest }}

  # What a team pulls is checked the way the container guide tells them to check
  # it, on both architectures: the signature, the SBOM and the provenance, the
  # version inside against the tag, the minor tag against the exact one -- and
  # then the end-to-end suite runs against the published image itself. A
  # failure here is a red release run, not an unpublished image: the note in
  # the log says what a team would find.
  verify:
    name: The published image, verified (${{ matrix.os }})
    needs: [check, image]
    if: needs.check.outputs.tag != ''
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
      packages: read
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, ubuntu-24.04-arm]
    env:
      IMAGE: ghcr.io/bedrock-python/pg-partsmith:${{ needs.image.outputs.version }}
      MINOR_IMAGE: ghcr.io/bedrock-python/pg-partsmith:${{ needs.image.outputs.minor }}
      VERSION: ${{ needs.image.outputs.version }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.check.outputs.tag }}
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Pull what was pushed
        run: docker pull "$IMAGE"

      - uses: sigstore/cosign-installer@v3
      - name: Signed by this repository's release workflow
        run: |
          cosign verify "$IMAGE" \
            --certificate-identity-regexp '^https://github.com/bedrock-python/pg-partsmith/' \
            --certificate-oidc-issuer https://token.actions.githubusercontent.com

      - name: The version inside, the label, the minor tag, the SBOM and the provenance
        run: |
          test "$(docker run --rm "$IMAGE" --version)" = "pg-partsmith ${VERSION}"
          test "$(docker image inspect "$IMAGE" -f '{{index .Config.Labels "org.opencontainers.image.version"}}')" = "$VERSION"
          test "$(docker buildx imagetools inspect "$IMAGE" --raw | sha256sum)" \
            = "$(docker buildx imagetools inspect "$MINOR_IMAGE" --raw | sha256sum)"
          docker buildx imagetools inspect "$IMAGE" --format '{{json .SBOM}}' | grep -q '"SPDX"'
          docker buildx imagetools inspect "$IMAGE" --format '{{json .Provenance}}' | grep -q '"SLSA"'

      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock
      - run: uv sync --frozen --no-default-groups --group test --extra pydantic-settings
      - name: End to end, against the published image
        run: uv run --no-sync pytest -m e2e
        env:
          PG_PARTSMITH_E2E_IMAGE: ${{ env.IMAGE }}
